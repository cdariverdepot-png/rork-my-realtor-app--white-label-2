name: Repair campaign captures
on:
  push:
    branches: [repair/compatibility-engine]
    paths: [diagnostics/capture.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/cap" --ignore-scripts --no-audit --no-fund typescript@6.0.3
      - name: Capture website-reader responses for all 25 diagnostic sites
        working-directory: expo
        run: |
          args=$(python3 -c "import json;print(' '.join('--id %s %s'%(s['id'],s['url']) for s in json.load(open('../diagnostics/sites-25.json'))))")
          NODE_PATH="$RUNNER_TEMP/cap/node_modules" node scripts/capture-build-pages.cjs --out "$RUNNER_TEMP/captures" $args
          mkdir -p ../diagnostics/captures && for f in "$RUNNER_TEMP"/captures/*.json; do gzip -9 -c "$f" > "../diagnostics/captures/$(basename "$f").gz"; done
      - name: Commit captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/captures && git commit -m "Website-reader captures ${GITHUB_RUN_ID} [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin repair/compatibility-engine && git push origin HEAD:repair/compatibility-engine && break; sleep 5; done
