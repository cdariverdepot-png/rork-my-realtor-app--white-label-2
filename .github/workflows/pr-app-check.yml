name: App check (pull request)
on:
  pull_request:
    paths: ['expo/**', '.github/workflows/pr-app-check.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: expo
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: expo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - name: Export web app (build only, no deploy)
        run: pnpm exec expo export --platform web --clear

      - name: Check preview credentials
        id: creds
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: echo "ok=$([ -n "$EXPO_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Expo
        if: steps.creds.outputs.ok == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Deploy web preview (never production)
        if: steps.creds.outputs.ok == 'true'
        run: |
          eas init --account jtaylor537 --force --non-interactive
          alias="pr-${{ github.event.pull_request.number }}"
          eas deploy --alias "$alias" --non-interactive
          echo "Preview: https://cdariverdepot-my-realtor--$alias.expo.app" >> "$GITHUB_STEP_SUMMARY"
