name: Deploy development preview (web, staging importer)
# An isolated web preview of the latest main for testing on a phone. It is NOT the production site:
#   - deployed as the EAS Hosting alias "preview" (https://<subdomain>--preview.expo.app), never --prod;
#   - built with EXPO_PUBLIC_FUNCTION_SUFFIX=-staging, so it calls the staging importer functions that the
#     stage gate deploys from the same code; production functions and App Store users are untouched;
#   - stamped with build.json (commit SHA, time) and checked after deploy: the live preview must serve this
#     build's own entry bundle and this commit's SHA, or the job fails.
on:
  push:
    branches: [main]
    paths: [diagnostics/preview.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preview-deploy
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: expo
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      HOSTING_SUBDOMAIN: ${{ vars.EXPO_HOSTING_SUBDOMAIN || 'cdariverdepot-my-realtor' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: expo/pnpm-lock.yaml
      - name: Check deployment credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN" || { echo "::error::Add EXPO_TOKEN in repository Actions secrets."; exit 1; }
      - name: Preview URL
        run: |
          url="https://${HOSTING_SUBDOMAIN}--preview.expo.app"
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_APP_URL=$url" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Regression suite and type check (the preview never ships failing code)
        run: |
          pnpm test
          pnpm exec tsc --noEmit
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link Expo project
        run: eas init --account jtaylor537 --force --non-interactive
      - name: Export the web app against the staging importer
        # Only the exported preview is pointed at staging; the tests above run as an ordinary build.
        env:
          EXPO_PUBLIC_FUNCTION_SUFFIX: '-staging'
        run: |
          pnpm exec expo export --platform web --clear
          entry="$(grep -o '/_expo/static/js/web/entry-[^"]*\.js' dist/index.html | head -1)"
          test -n "$entry" || { echo "::error::no entry bundle in dist/index.html"; exit 1; }
          printf '{"commit":"%s","builtAt":"%s","importer":"staging","entry":"%s"}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" "$entry" > dist/build.json
          echo "ENTRY=$entry" >> "$GITHUB_ENV"
      - name: Deploy the preview alias (never production)
        run: |
          set -o pipefail
          eas deploy --alias preview --non-interactive 2>&1 | tee "$RUNNER_TEMP/deploy.log"
      - name: Verify the live preview serves this build
        id: verify
        run: |
          # The URLs EAS reports for this deployment (alias first), then the conventional alias URL.
          urls="$(grep -oE 'https://[a-z0-9-]+\.expo\.app' "$RUNNER_TEMP/deploy.log" | awk '!seen[$0]++' | sort -t- -k3 | tr '\n' ' ')"
          urls="$(echo $urls | tr ' ' '\n' | grep -- '--preview' ; echo $urls | tr ' ' '\n' | grep -v -- '--preview'; echo "$PREVIEW_URL")"
          echo "$urls" > "$RUNNER_TEMP/urls.txt"
          found=""
          for i in $(seq 1 20); do
            for url in $(cat "$RUNNER_TEMP/urls.txt"); do
              live="$(curl -fsSL --max-time 20 "$url/build.json" || true)"
              if echo "$live" | grep -q "$GITHUB_SHA" && curl -fsSL --max-time 20 "$url/" | grep -q "$ENTRY"; then found="$url"; break 2; fi
            done
            sleep 15
          done
          echo "verified=$found" >> "$GITHUB_OUTPUT"
          test -n "$found" || { echo "::error::no deployed URL serves commit $GITHUB_SHA"; exit 1; }
          for route in / /welcome /auth/callback; do curl -fsS --max-time 20 -o /dev/null "$found$route"; done
          echo "PREVIEW_URL=$found" >> "$GITHUB_ENV"
          printf 'Preview: %s\nCommit: %s\nImporter: staging functions\n' "$found" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Record the preview (always, so a failure is diagnosable from the repository)
        if: always()
        working-directory: .
        run: |
          mkdir -p diagnostics
          node -e '
            const fs = require("fs"), t = process.env.RUNNER_TEMP;
            const read = f => fs.existsSync(f) ? fs.readFileSync(f, "utf8") : "";
            fs.writeFileSync("diagnostics/preview-deployed.json", JSON.stringify({
              verified: process.env.VERIFIED || null, commit: process.env.GITHUB_SHA, entry: process.env.ENTRY || null,
              importer: "staging", at: new Date().toISOString(), triedUrls: read(t + "/urls.txt").split("\n").filter(Boolean),
              deployLog: read(t + "/deploy.log").split("\n").filter(l => l.trim()).slice(-40) }, null, 2) + "\n");'
          if [ -n "$VERIFIED" ]; then npx --yes qrcode@1.5.4 -w 480 -o diagnostics/preview-qr.png "$VERIFIED"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/preview-deployed.json diagnostics/preview-qr.png 2>/dev/null; git add diagnostics/preview-deployed.json
          git commit -m "Preview deployment record for ${GITHUB_SHA} [skip ci]" || exit 0
          ok=0; for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && ok=1 && break; sleep $((i * 5)); done; [ "$ok" = 1 ]
        env:
          VERIFIED: ${{ steps.verify.outputs.verified }}
