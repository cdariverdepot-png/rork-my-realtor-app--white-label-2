name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'xdcqjaodcvnlawqcunrr' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Add SUPABASE_ACCESS_TOKEN in repository Actions secrets (Supabase dashboard → Account → Access Tokens)."; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy analyze-realtor-build
        run: supabase functions deploy analyze-realtor-build --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt

      - name: Deploy refresh-listings
        run: supabase functions deploy refresh-listings --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt

      - name: Deploy send-push
        run: supabase functions deploy send-push --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt

      - name: Deploy report-client-error
        run: supabase functions deploy report-client-error --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt

