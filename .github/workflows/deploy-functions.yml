name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  importer-regression:
    uses: ./.github/workflows/listing-compatibility.yml
  deploy:
    needs: importer-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'xdcqjaodcvnlawqcunrr' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Add SUPABASE_ACCESS_TOKEN in repository Actions secrets (Supabase dashboard → Account → Access Tokens)."; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Preserve listing renderer configuration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if ! curl -fsS --max-time 20 https://cdariver-listing-renderer.fly.dev/health | grep -q '"ok":true'; then
            echo "Listing renderer is not live. Importer functions will use Deno.env only."
            exit 0
          fi
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::The listing renderer is live, but FLY_API_TOKEN is missing, so this deploy would drop the renderer from the importer."
            exit 1
          fi
          curl -fsSL https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"
          raw=$(fly ssh console --app cdariver-listing-renderer -C "printenv LISTING_RENDER_TOKEN" </dev/null 2>/tmp/fly-ssh.err || true)
          token=$(printf '%s\n' "$raw" | tr -d '\r' | grep -E '^[0-9a-f]{48}$' | tail -n 1 || true)
          if [ -z "$token" ]; then
            echo "::error::Could not read the renderer token from Fly. Refusing to redeploy the importer without it."
            exit 1
          fi
          echo "::add-mask::$token"
          LISTING_RENDER_TOKEN="$token" LISTING_RENDER_URL="https://cdariver-listing-renderer.fly.dev" python3 scripts/bake-listing-render-env.py

      - name: Deploy analyze-realtor-build
        run: supabase functions deploy analyze-realtor-build --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt

      - name: Deploy refresh-listings
        run: supabase functions deploy refresh-listings --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt

      - name: Deploy send-push
        run: supabase functions deploy send-push --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt

      - name: Deploy report-client-error
        run: supabase functions deploy report-client-error --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt

