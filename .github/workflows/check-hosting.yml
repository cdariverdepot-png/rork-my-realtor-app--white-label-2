name: Check Expo hosting
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-hosting.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production routes
        run: |
          for route in / /welcome /auth/callback; do
            url="https://cdariverdepot-my-realtor.expo.app$route"
            curl --fail --silent --show-error --location --max-time 20 --retry 20 --retry-all-errors --retry-delay 10 "$url" -o page.html
            grep -q '<!DOCTYPE html>' page.html
            echo "Verified $url"
          done
