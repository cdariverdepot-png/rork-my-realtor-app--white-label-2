name: Renderer logs
on: workflow_dispatch
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Recent renderer logs
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"
          timeout 25 fly logs --app cdariver-listing-renderer --no-tail || true
