name: 25-site importer diagnostic
on:
  push:
    branches: [probe/live-import]
    paths: [diagnostics/run-25.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OUT_DIR: ${{ github.workspace }}/diag-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/diag" --no-audit --no-fund playwright@1.55.0 image-size@2.0.2
          "$RUNNER_TEMP/diag/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run each site through the deployed app (sequential, one isolated owner-test session per site)
        run: SITES="$(cat diagnostics/sites-25.json)" NODE_PATH="$RUNNER_TEMP/diag/node_modules" node expo/scripts/diagnostic-sites.cjs
      - name: Commit results
        if: always()
        run: |
          dest="diagnostics/run-${GITHUB_RUN_ID}"
          mkdir -p "$dest" && cp -r diag-out/* "$dest"/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics && git commit -m "25-site diagnostic results ${GITHUB_RUN_ID} [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin probe/live-import && git push origin HEAD:probe/live-import && break; sleep 5; done
